services:
  traefik:
    image: "traefik:v3.0"
    container_name: "traefik"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOT_DOMAIN: "${BOT_DOMAIN:-bot.example.com}"
    volumes:
      - "./certs:/certs:ro"
      - "./traefik-static.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic.yml:/etc/traefik/dynamic.yml:ro"
    command:
      - "--configfile=/etc/traefik/traefik.yml"

  redis:
    image: redis:latest
    container_name: 3xui-shop-redis
    restart: always
    volumes:
      - redis_data:/data

  bot:
    build: .
    container_name: 3xui-shop-bot
    volumes:
      - ./app/data:/app/data
      - ./plans.json:/app/data/plans.json
      - ./app/locales:/app/locales
      - ./app/logs:/app/logs
    env_file:
      - .env
    stop_signal: SIGINT
    restart: unless-stopped
    command: sh -c " 
      poetry run pybabel compile -d /app/locales -D bot && 
      poetry run alembic -c /app/db/alembic.ini upgrade heads && 
      poetry run python -m app"
    depends_on:
      - redis

volumes:
  redis_data:
