[tool.poetry]
name = "swaga-vpn"
version = "1.1.0"
description = "This is a Telegram bot for selling VPN subscriptions. It works with 3X-UI."
authors = ["Hardcore-lab"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.16"
aiogram = "^3.34.0"
aiohttp = "^3.14.4"
asyncpg = "^0.30.0"
babel = "^2.16.0"
cryptography = "^50.0.0"
environs = "^11.2.1"
cachetools = "^5.5.0"
py3xui = "^0.3.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
aiosqlite = "^0.20.0"
alembic = "^1.14.0"
redis = "^5.2.1"
apscheduler = "^3.11.0"
prometheus-client = "^0.21.0"
pytest = {version = "^9.0.2", optional = true}
pytest-asyncio = {version = "^1.3.0", optional = true}

[tool.poetry.extras]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
